<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Completo | Sushi Poke Maracay</title>
    <meta name="description" content="Explora el menú completo de Sushi Poke Maracay: rolls fríos, tempurizados, entradas, ensaladas, poke bowls, bebidas y postres. Ordena por WhatsApp.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <!-- Aquí puedes mantener los estilos específicos de la página de menú -->
</head>
<body>

    <!-- Header inyectado dinámicamente -->
    <div id="site-header"></div>

    <!-- Hero -->
    <section class="menu-hero">
        <div class="menu-hero-inner">
            <nav class="breadcrumb" aria-label="Ruta de navegación">
                <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
                <i class="fas fa-chevron-right"></i>
                <span>Menú completo</span>
            </nav>
            <h1>Nuestro Menú <span>Completo</span></h1>
            <p>Rolls fríos, tempurizados, entradas, ensaladas, poke bowls, bebidas y postres. Todo preparado al momento con ingredientes frescos.</p>
        </div>
    </section>

    <!-- Barra sticky: búsqueda + categorías -->
    <div class="menu-subnav">
        <div class="menu-subnav-inner">
            <div class="menu-search" id="menuSearchWrap">
                <i class="fas fa-search"></i>
                <input type="search" id="menuSearchInput" placeholder="Buscar rolls, poke bowls, bebidas…" autocomplete="off" aria-label="Buscar en el menú">
                <button class="menu-search-clear" id="menuSearchClear" type="button" aria-label="Limpiar búsqueda">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="category-chips" id="categoryChips" role="tablist" aria-label="Categorías del menú"></div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="menu-body">
        <div class="menu-toolbar">
            <p id="resultsCount">Cargando menú…</p>
            <div class="menu-sort">
                <label for="sortSelect"><i class="fas fa-arrow-down-wide-short"></i> Ordenar:</label>
                <select id="sortSelect">
                    <option value="default">Recomendados</option>
                    <option value="price-asc">Precio: menor a mayor</option>
                    <option value="price-desc">Precio: mayor a menor</option>
                    <option value="name-asc">Nombre: A – Z</option>
                </select>
            </div>
        </div>

        <div class="products-grid" id="productsGrid"></div>

        <div class="menu-empty" id="menuEmpty" hidden>
            <i class="fas fa-magnifying-glass"></i>
            <h3>No encontramos resultados</h3>
            <p id="menuEmptyText">Prueba con otra palabra o revisa otra categoría.</p>
            <button class="btn btn-outline" type="button" onclick="clearFilters()">
                <i class="fas fa-rotate-left"></i> Limpiar filtros
            </button>
        </div>

        <div class="load-more-wrap" id="loadMoreWrap" hidden>
            <button class="btn btn-outline" type="button" id="loadMoreBtn">
                <i class="fas fa-chevron-down"></i> Cargar más productos
            </button>
        </div>
    </main>

    <!-- Footer inyectado dinámicamente -->
    <div id="site-footer"></div>

    <!-- Bottom Navigation Bar móvil inyectada -->
    <div id="site-bottom-nav"></div>

    <!-- Modales y Cart Drawer inyectados dinámicamente -->
    <div id="site-modals"></div>

    <!-- Scripts (Asegúrate de incluir layout.js antes de menu.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
